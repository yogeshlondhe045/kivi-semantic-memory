# Warehouse layout - single source of truth for the digital twin.
#
# Consumed by:
#   uco_simulation/scripts/generate_world.py  -> Gazebo world SDF
#   uco_navigation (generated)                -> occupancy map + keepout mask
#   uco_wms                                   -> storage / holding / quarantine / dispatch slots
#   uco_safety                                -> speed and restricted zones
#   uco_fleet                                 -> named navigation targets
#   uco_dashboard                             -> layout drawing
#
# Units: metres, degrees. Frame: world == map, origin at the inner south-west corner.
# Rectangles are [xmin, ymin, xmax, ymax].

facility:
  name: "UCO Collection & Storage Pilot Facility"
  world_name: uco_warehouse
  size: [36.0, 24.0]          # inner dimensions x, y
  wall_thickness: 0.2
  wall_height: 3.5

map:
  resolution: 0.05
  margin: 1.0                 # map extends this far beyond the outer walls
  min_obstacle_height: 0.05   # objects lower than this are not drawn in the map

agv:
  approach_distance: 1.6      # default distance from slot centre to AGV access pose
  deck_height: 0.35           # top of the AGV lift deck

# Doors are closed roller shutters cut into the perimeter walls.
doors:
  - {id: DOCK_DOOR, wall: west, span: [18.0, 22.0], label: "Receiving dock door"}
  - {id: DISPATCH_DOOR, wall: east, span: [18.0, 22.0], label: "Transfer door to processing plant"}
  - {id: PERSONNEL_DOOR, wall: south, span: [12.6, 13.6], label: "Personnel door"}

zones:
  # kind: AREA (informational), SPEED (speed limit applies), RESTRICTED (keep-out + alarm)
  - {id: RECEIVING, name: "Receiving area", kind: SPEED, rect: [0.2, 13.0, 12.0, 19.2], speed_limit: 0.3, color: [0.95, 0.75, 0.2]}
  - {id: RECEIVING_PROCESS, name: "Unloading / weighing / inspection line", kind: RESTRICTED, rect: [0.2, 19.2, 12.0, 23.8], color: [0.9, 0.3, 0.2]}
  - {id: STORAGE, name: "Automated storage", kind: SPEED, rect: [12.2, 0.2, 25.2, 12.8], speed_limit: 0.5, color: [0.3, 0.6, 0.95]}
  - {id: DISPATCH, name: "Dispatch / processing buffer", kind: SPEED, rect: [29.0, 8.6, 35.8, 23.8], speed_limit: 0.4, color: [0.3, 0.85, 0.4]}
  - {id: CHARGING, name: "Charging station", kind: SPEED, rect: [1.4, 0.2, 4.6, 3.0], speed_limit: 0.3, color: [0.6, 0.4, 0.9]}
  - {id: QUARANTINE, name: "Quarantine / rejected material", kind: AREA, rect: [6.2, 0.2, 11.4, 2.2], color: [0.95, 0.5, 0.1]}
  - {id: TANK_FARM, name: "Bulk UCO tank farm (bunded)", kind: RESTRICTED, rect: [29.3, 0.2, 35.8, 8.2], color: [0.9, 0.3, 0.2]}
  - {id: MAINTENANCE, name: "Maintenance bay", kind: RESTRICTED, rect: [25.6, 19.5, 29.0, 23.8], color: [0.9, 0.3, 0.2]}
  - {id: OFFICE, name: "Control room / office", kind: AREA, rect: [0.2, 6.0, 6.0, 12.0], color: [0.6, 0.6, 0.6]}

# Default speed when the AGV is not in a SPEED zone (m/s).
default_speed_limit: 0.8

# Static obstacles. shape: box (size x,y,z) or cylinder (radius, height). z is the base height.
static_obstacles:
  # receiving line
  - {id: conveyor, shape: box, center: [6.0, 20.5], size: [10.0, 0.9, 0.7], color: [0.35, 0.35, 0.4]}
  - {id: inspection_booth_roof, shape: box, center: [9.5, 20.5], size: [2.0, 1.8, 0.1], z: 2.4, color: [0.85, 0.85, 0.9], collision: false}
  - {id: inspection_post_1, shape: box, center: [8.55, 19.65], size: [0.1, 0.1, 2.4], color: [0.85, 0.85, 0.9]}
  - {id: inspection_post_2, shape: box, center: [10.45, 19.65], size: [0.1, 0.1, 2.4], color: [0.85, 0.85, 0.9]}
  - {id: inspection_post_3, shape: box, center: [8.55, 21.35], size: [0.1, 0.1, 2.4], color: [0.85, 0.85, 0.9]}
  - {id: inspection_post_4, shape: box, center: [10.45, 21.35], size: [0.1, 0.1, 2.4], color: [0.85, 0.85, 0.9]}
  - {id: receiving_barrier, shape: box, center: [6.1, 19.2], size: [11.6, 0.08, 1.0], color: [0.95, 0.8, 0.1]}
  # office (walled, not accessible to the AGV)
  - {id: office_wall_s, shape: box, center: [3.1, 6.0], size: [5.8, 0.15, 2.6], color: [0.8, 0.8, 0.75]}
  - {id: office_wall_n, shape: box, center: [3.1, 12.0], size: [5.8, 0.15, 2.6], color: [0.8, 0.8, 0.75]}
  - {id: office_wall_e, shape: box, center: [6.0, 9.0], size: [0.15, 6.15, 2.6], color: [0.8, 0.8, 0.75]}
  # storage racks: guard rail behind row A-R01, back-to-back spine, end posts
  - {id: rack_guard_rail_north, shape: box, center: [18.6, 12.85], size: [12.8, 0.1, 1.0], color: [0.95, 0.55, 0.1]}
  - {id: rack_spine, shape: box, center: [18.6, 6.9], size: [12.8, 0.12, 1.4], color: [0.2, 0.35, 0.7]}
  - {id: rack_post_a1w, shape: box, center: [12.2, 12.0], size: [0.12, 0.12, 2.6], color: [0.2, 0.35, 0.7]}
  - {id: rack_post_a1e, shape: box, center: [25.0, 12.0], size: [0.12, 0.12, 2.6], color: [0.2, 0.35, 0.7]}
  - {id: rack_post_a2w, shape: box, center: [12.2, 7.6], size: [0.12, 0.12, 2.6], color: [0.2, 0.35, 0.7]}
  - {id: rack_post_a2e, shape: box, center: [25.0, 7.6], size: [0.12, 0.12, 2.6], color: [0.2, 0.35, 0.7]}
  - {id: rack_post_b1w, shape: box, center: [12.2, 6.2], size: [0.12, 0.12, 2.6], color: [0.2, 0.35, 0.7]}
  - {id: rack_post_b1e, shape: box, center: [25.0, 6.2], size: [0.12, 0.12, 2.6], color: [0.2, 0.35, 0.7]}
  - {id: rack_post_b2w, shape: box, center: [12.2, 1.8], size: [0.12, 0.12, 2.6], color: [0.2, 0.35, 0.7]}
  - {id: rack_post_b2e, shape: box, center: [25.0, 1.8], size: [0.12, 0.12, 2.6], color: [0.2, 0.35, 0.7]}
  # tank farm: bund wall + vertical tanks
  - {id: bund_n, shape: box, center: [32.55, 8.2], size: [6.5, 0.25, 0.6], color: [0.7, 0.7, 0.68]}
  - {id: bund_w, shape: box, center: [29.3, 4.2], size: [0.25, 8.0, 0.6], color: [0.7, 0.7, 0.68]}
  - {id: tank_1, shape: cylinder, center: [31.2, 2.6], radius: 1.1, height: 5.0, color: [0.75, 0.78, 0.8]}
  - {id: tank_2, shape: cylinder, center: [34.2, 2.6], radius: 1.1, height: 5.0, color: [0.75, 0.78, 0.8]}
  - {id: tank_3, shape: cylinder, center: [32.7, 5.9], radius: 1.1, height: 5.0, color: [0.75, 0.78, 0.8]}
  # charger unit and protective barriers
  - {id: charger_unit, shape: box, center: [3.0, 0.4], size: [0.8, 0.35, 0.9], color: [0.25, 0.25, 0.3]}
  - {id: charger_barrier_w, shape: box, center: [1.4, 1.5], size: [0.1, 2.6, 0.9], color: [0.95, 0.8, 0.1]}
  - {id: charger_barrier_e, shape: box, center: [4.6, 1.5], size: [0.1, 2.6, 0.9], color: [0.95, 0.8, 0.1]}
  # empty pallet store (north centre) - static clutter the planner must avoid
  - {id: pallet_stack_1, shape: box, center: [15.0, 21.6], size: [1.2, 1.0, 1.3], color: [0.65, 0.5, 0.3]}
  - {id: pallet_stack_2, shape: box, center: [16.6, 21.6], size: [1.2, 1.0, 1.0], color: [0.65, 0.5, 0.3]}
  - {id: pallet_stack_3, shape: box, center: [18.2, 21.6], size: [1.2, 1.0, 1.5], color: [0.65, 0.5, 0.3]}
  # building columns
  - {id: column_1, shape: box, center: [12.0, 18.0], size: [0.4, 0.4, 3.5], color: [0.6, 0.6, 0.62]}
  - {id: column_2, shape: box, center: [24.0, 18.0], size: [0.4, 0.4, 3.5], color: [0.6, 0.6, 0.62]}

# Named locations. kind: STATION (no AGV access), HOLDING, STORAGE, QUARANTINE, DISPATCH, CHARGER, PARKING.
# slot = where a container stands; face = heading the AGV has when docked at the slot.
# The AGV access pose is slot - approach_distance * (cos face, sin face) unless 'access' is given.
locations:
  - {id: UNLOAD, kind: STATION, zone: RECEIVING_PROCESS, slot: [2.5, 20.5], label: "Unloading station"}
  - {id: WEIGH, kind: STATION, zone: RECEIVING_PROCESS, slot: [6.0, 20.5], label: "Weighing station"}
  - {id: INSPECT, kind: STATION, zone: RECEIVING_PROCESS, slot: [9.5, 20.5], label: "Inspection station"}
  - {id: HOLD-01, kind: HOLDING, zone: RECEIVING, slot: [2.0, 17.6], face: 90}
  - {id: HOLD-02, kind: HOLDING, zone: RECEIVING, slot: [4.0, 17.6], face: 90}
  - {id: HOLD-03, kind: HOLDING, zone: RECEIVING, slot: [6.0, 17.6], face: 90}
  - {id: HOLD-04, kind: HOLDING, zone: RECEIVING, slot: [8.0, 17.6], face: 90}
  - {id: HOLD-05, kind: HOLDING, zone: RECEIVING, slot: [10.0, 17.6], face: 90}
  - {id: Q-01, kind: QUARANTINE, zone: QUARANTINE, slot: [7.2, 1.2], face: -90}
  - {id: Q-02, kind: QUARANTINE, zone: QUARANTINE, slot: [8.8, 1.2], face: -90}
  - {id: Q-03, kind: QUARANTINE, zone: QUARANTINE, slot: [10.4, 1.2], face: -90}
  - {id: DSP-01, kind: DISPATCH, zone: DISPATCH, slot: [34.4, 11.0], face: 0}
  - {id: DSP-02, kind: DISPATCH, zone: DISPATCH, slot: [34.4, 12.6], face: 0}
  - {id: DSP-03, kind: DISPATCH, zone: DISPATCH, slot: [34.4, 14.2], face: 0}
  - {id: DSP-04, kind: DISPATCH, zone: DISPATCH, slot: [34.4, 15.8], face: 0}
  - {id: CHG-01, kind: CHARGER, zone: CHARGING, slot: [3.0, 0.4], face: -90, access: [3.0, 1.45, -90]}
  - {id: PARK-01, kind: PARKING, zone: STORAGE, slot: [27.2, 14.5], face: 180, access: [27.2, 14.5, 180]}

# Storage grid generator: one location per (aisle, bay, row).
# id format: <aisle>-<bay:02d>-<row>  e.g. A-03-R02
storage_blocks:
  - aisle: A
    bays: {start_x: 13.0, pitch: 1.6, count: 8}
    rows:
      - {row: R01, slot_y: 12.0, face: 90}    # north side of aisle A
      - {row: R02, slot_y: 7.6, face: -90}    # south side of aisle A
  - aisle: B
    bays: {start_x: 13.0, pitch: 1.6, count: 8}
    rows:
      - {row: R01, slot_y: 6.2, face: 90}
      - {row: R02, slot_y: 1.6, face: -90}

# Container types handled by the facility.
container_types:
  DRUM_200L:
    label: "200 L steel drum on pallet"
    nominal_volume_l: 200
    tare_kg: 33.0             # drum 18 kg + pallet 15 kg
    footprint: [0.8, 0.8]
    height: 1.02
  IBC_1000L:
    label: "1000 L IBC tote"
    nominal_volume_l: 1000
    tare_kg: 62.0
    footprint: [1.2, 1.0]
    height: 1.16

material:
  name: "Used Cooking Oil"
  density_kg_per_l: 0.92
