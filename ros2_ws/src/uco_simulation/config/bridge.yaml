# ros_gz_bridge configuration: Gazebo <-> ROS 2 topics and services for the warehouse simulation.
- ros_topic_name: /clock
  gz_topic_name: /clock
  ros_type_name: rosgraph_msgs/msg/Clock
  gz_type_name: gz.msgs.Clock
  direction: GZ_TO_ROS

# --- AGV-01 actuation and odometry ---
- ros_topic_name: /agv/cmd_vel
  gz_topic_name: /agv/cmd_vel
  ros_type_name: geometry_msgs/msg/Twist
  gz_type_name: gz.msgs.Twist
  direction: ROS_TO_GZ
- ros_topic_name: /agv/odom
  gz_topic_name: /agv/odom
  ros_type_name: nav_msgs/msg/Odometry
  gz_type_name: gz.msgs.Odometry
  direction: GZ_TO_ROS
- ros_topic_name: /tf
  gz_topic_name: /agv/tf
  ros_type_name: tf2_msgs/msg/TFMessage
  gz_type_name: gz.msgs.Pose_V
  direction: GZ_TO_ROS
- ros_topic_name: /joint_states
  gz_topic_name: /agv/joint_states
  ros_type_name: sensor_msgs/msg/JointState
  gz_type_name: gz.msgs.Model
  direction: GZ_TO_ROS
- ros_topic_name: /agv/ground_truth
  gz_topic_name: /agv/ground_truth
  ros_type_name: nav_msgs/msg/Odometry
  gz_type_name: gz.msgs.Odometry
  direction: GZ_TO_ROS

# --- AGV-01 sensors (raw; uco_safety's sensor gateway republishes /agv/scan) ---
- ros_topic_name: /agv/scan_raw
  gz_topic_name: /agv/scan_raw
  ros_type_name: sensor_msgs/msg/LaserScan
  gz_type_name: gz.msgs.LaserScan
  direction: GZ_TO_ROS
- ros_topic_name: /agv/scan_rear_raw
  gz_topic_name: /agv/scan_rear_raw
  ros_type_name: sensor_msgs/msg/LaserScan
  gz_type_name: gz.msgs.LaserScan
  direction: GZ_TO_ROS
- ros_topic_name: /agv/imu
  gz_topic_name: /agv/imu
  ros_type_name: sensor_msgs/msg/Imu
  gz_type_name: gz.msgs.IMU
  direction: GZ_TO_ROS

# --- world services used to spawn, remove and move containers ---
- service_name: /world/uco_warehouse/create
  ros_type_name: ros_gz_interfaces/srv/SpawnEntity
  gz_req_type_name: gz.msgs.EntityFactory
  gz_rep_type_name: gz.msgs.Boolean
- service_name: /world/uco_warehouse/remove
  ros_type_name: ros_gz_interfaces/srv/DeleteEntity
  gz_req_type_name: gz.msgs.Entity
  gz_rep_type_name: gz.msgs.Boolean
- service_name: /world/uco_warehouse/set_pose
  ros_type_name: ros_gz_interfaces/srv/SetEntityPose
  gz_req_type_name: gz.msgs.Pose
  gz_rep_type_name: gz.msgs.Boolean
