safety_manager:
  ros__parameters:
    use_sim_time: true
    scan_timeout_s: 1.0
    odom_timeout_s: 1.0
    heartbeat_timeout_s: 3.0
    blocked_timeout_s: 20.0
    battery_low_pct: 25.0
    battery_critical_pct: 10.0
    rate_hz: 10.0
    localization_degraded_below: 0.4
    localization_lost_below: 0.2
    localization_persist_s: 5.0
